
name: Build Application Unpackaged

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

jobs:

  build:
    strategy:
      matrix:
        configuration: [Release_Unpackaged]
        platform: [x64]

    runs-on: windows-latest

    env:
      Project_Path: WingetGUIInstaller/WingetGUIInstaller.csproj
      Project_Sdk_Version: "net10.0-windows10.0.26100.0"
      Project_Directory: WingetGUIInstaller
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

    - name: Get tag
      id: tag
      uses: dawidd6/action-get-tag@v1

    - name: Extract version for VeloPack
      id: version
      run: |
        $tag = "${{steps.tag.outputs.tag}}"
        # Remove 'v' prefix if present
        $version = $tag -replace '^v', ''
        # VeloPack requires 3-part version, so convert 4-part to 3-part (drop the 4th component)
        if ($version -match '^\d+\.\d+\.\d+\.\d+$') {
          $parts = $version -split '\.'
          $vpkversion = "$($parts[0]).$($parts[1]).$($parts[2])"
          Write-Output "vpkversion=$vpkversion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        } else {
          Write-Output "vpkversion=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        }

    # Install .NET 10
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v1.0.1  

    # Restore the application
    - name: Restore the application
      run: dotnet restore $env:Project_Path -r win-${{ matrix.platform }}

    # Build and publish the project 
    - name: Build the Windows Application
      run: dotnet publish $env:Project_Path -c ${{ matrix.configuration }} -r win-${{ matrix.platform }} --self-contained /p:Platform=${{ matrix.platform }} /p:Version=${{steps.tag.outputs.tag}}

    - name: Zip the build Output
      run: Compress-Archive -Path $env:Project_Directory\bin\Release\$env:Project_Sdk_Version\win-${{ matrix.platform }}\publish\* -Destination ${{ github.workspace }}\WingetGUIInstaller_${{ matrix.platform }}_${{steps.tag.outputs.tag}}.zip

    - name: Show build output
      run: dir $env:Project_Directory\bin\Release\$env:Project_Sdk_Version\win-${{ matrix.platform }}\publish

    # Create VeloPack Release
    - name: Create VeloPack Release
      run: |
        dotnet tool install -g vpk
        vpk download github --repoUrl https://github.com/${{ github.repository }}
        vpk pack -u WingetGUIInstaller -v ${{steps.version.outputs.vpkversion}} -p $env:Project_Directory\bin\Release\$env:Project_Sdk_Version\win-${{ matrix.platform }}\publish
        vpk upload github --repoUrl https://github.com/${{ github.repository }} --publish --releaseName "WingetGUIInstaller ${{ steps.tag.outputs.tag }}" --tag ${{ steps.tag.outputs.tag }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Show VeloPack output
      run: dir $env:LOCALAPPDATA\Vpk\releases -Recurse -ErrorAction SilentlyContinue; dir . -Recurse -Include "*.exe", "*.nupkg", "RELEASES"

    # Create the release:
    - name: Create Release
      uses: ncipollo/release-action@v1.10.0
      continue-on-error: true
      with:
        tag: ${{ steps.tag.outputs.tag }}
        name:  ${{ steps.tag.outputs.tag }}
        draft: false
        prerelease: false
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload ZIP to Release
      uses: AButler/upload-release-assets@v4.0
      with:
        files: "WingetGUIInstaller_${{ matrix.platform }}_${{steps.tag.outputs.tag}}.zip"
        repo-token: ${{ secrets.GITHUB_TOKEN }}