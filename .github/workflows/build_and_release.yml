name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

concurrency:
  group: build-and-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-version:
    name: Prepare version metadata
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      raw: ${{ steps.version.outputs.raw }}
      clean: ${{ steps.version.outputs.clean }}
      msix: ${{ steps.version.outputs.msix }}
      vpk: ${{ steps.version.outputs.vpk }}

    steps:
      - name: Normalize version inputs
        id: version
        shell: bash
        run: |
          raw="${{github.ref_name}}"
          if [[ "${{github.ref}}" == refs/tags/* ]]; then
            clean="${raw#v}"
            msix="${clean}"
            if [[ "$clean" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              IFS='.' read -r major minor patch build <<< "$clean"
              vpk="${major}.${minor}.${patch}"
            else
              vpk="${clean}"
            fi
          else
            clean="0.0.1-ci.${{ github.run_number }}.${{ github.run_attempt }}"
            msix="0.0.$(( ${{ github.run_number }} % 65535 )).$(( ${{ github.run_attempt }} % 65535 ))"
            vpk="0.0.$(( ${{ github.run_number }} % 65535 ))"
          fi
          echo "raw=${raw}" >> "$GITHUB_OUTPUT"
          echo "clean=${clean}" >> "$GITHUB_OUTPUT"
          echo "msix=${msix}" >> "$GITHUB_OUTPUT"
          echo "vpk=${vpk}" >> "$GITHUB_OUTPUT"

  build-wingethelper-nuget:
    name: Build WingetHelper NuGet
    needs: prepare-version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            WingetHelper/WingetHelper.csproj

      - name: Restore dependencies
        run: dotnet restore WingetHelper

      - name: Build
        run: dotnet build WingetHelper --no-restore --configuration Release -p:Version=${{ needs.prepare-version.outputs.clean }}

      - name: Pack
        run: dotnet pack WingetHelper --configuration Release --no-build -p:Version=${{ needs.prepare-version.outputs.clean }} -o artifacts/nuget

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error

  build-app-packaged:
    name: Build Packaged App (${{ matrix.platform }})
    needs: prepare-version
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      matrix:
        configuration: [Release]
        platform: [x86, x64]

    env:
      Solution_Path: WingetGUIInstaller.slnx
      App_Project_Directory: WingetGUIInstaller
      SigningCertificate: zsolt9331_sideload.pfx

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            WingetGUIInstaller/WingetGUIInstaller.csproj
            WingetHelper/WingetHelper.csproj

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

      - name: Decode and import PFX
        shell: pwsh
        env:
          BASE64_CERTIFICATE: ${{ secrets.BASE64_CERTIFICATE }}
        run: |
          $currentDirectory = Get-Location
          $pfx_cert_byte = [System.Convert]::FromBase64String("${{ env.BASE64_CERTIFICATE }}")
          $certificatePath = Join-Path -Path $currentDirectory -ChildPath ${{ env.App_Project_Directory }} -AdditionalChildPath ${{ env.SigningCertificate }}
          [IO.File]::WriteAllBytes("$certificatePath", $pfx_cert_byte)

      - name: Update manifest version
        shell: pwsh
        run: |
          [xml]$manifest = Get-Content ".\${{ env.App_Project_Directory }}\Package.appxmanifest"
          $manifest.Package.Identity.Version = "${{ needs.prepare-version.outputs.msix }}"
          $manifest.Save(".\${{ env.App_Project_Directory }}\Package.appxmanifest")

      - name: Restore
        run: msbuild ${{ env.Solution_Path }} /t:Restore /p:Configuration=${{ matrix.configuration }}

      - name: Build packaged app
        run: msbuild ${{env.Solution_Path}} /p:Configuration=${{ matrix.configuration }} /p:Platform=${{ matrix.platform }} /p:UapAppxPackageBuildMode=StoreUpload /p:AppxBundle=Always /p:PackageCertificateKeyFile=${{ env.SigningCertificate }} /p:AppxPackageDir=Packages\ /p:GenerateAppxPackageOnBuild=true

      - name: Remove PFX
        if: always()
        shell: pwsh
        run: Remove-Item -Path "${{ env.App_Project_Directory }}\${{ env.SigningCertificate }}" -ErrorAction SilentlyContinue

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v7
        with:
          name: packaged-msix-${{ matrix.platform }}
          path: WingetGUIInstaller/Packages/*/*.msixbundle
          if-no-files-found: error

  build-app-unpackaged:
    name: Build Unpackaged App (${{ matrix.platform }})
    needs: prepare-version
    runs-on: windows-latest
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      matrix:
        configuration: [Release_Unpackaged]
        platform: [x86, x64]

    env:
      Project_Path: WingetGUIInstaller/WingetGUIInstaller.csproj
      Project_Sdk_Version: net10.0
      Project_Directory: WingetGUIInstaller
      VELOPACK_CHANNEL: win-${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            WingetGUIInstaller/WingetGUIInstaller.csproj
            WingetHelper/WingetHelper.csproj

      - name: Restore
        run: dotnet restore ${{ env.Project_Path }} -r win-${{ matrix.platform }}

      - name: Publish
        run: dotnet publish ${{ env.Project_Path }} -c ${{ matrix.configuration }} -r win-${{ matrix.platform }} --self-contained /p:Platform=${{ matrix.platform }} /p:Version=${{ needs.prepare-version.outputs.clean }}

      - name: Build VeloPack assets
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool install -g vpk
          vpk download github --repoUrl https://github.com/${{ github.repository }} --token "${{ env.GITHUB_TOKEN }}" --channel "${{ env.VELOPACK_CHANNEL }}"
          vpk pack -u WingetGUIInstaller -v ${{ needs.prepare-version.outputs.vpk }} --channel "${{ env.VELOPACK_CHANNEL }}" -p ${{ env.Project_Directory }}/bin/Release/${{ env.Project_Sdk_Version }}/win-${{ matrix.platform }}/publish

      - name: Upload Velopack artifacts
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: velopack-${{ matrix.platform }}
          path: Releases\**
          if-no-files-found: error

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - prepare-version
      - build-wingethelper-nuget
      - build-app-packaged
      - build-app-unpackaged
    permissions:
      contents: write
      packages: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push NuGet package
        run: dotnet nuget push "artifacts/nuget-packages/*.nupkg" --skip-duplicate --no-symbols

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/nuget-packages/*.nupkg
            artifacts/packaged-msix-*/**/*.msixbundle
            artifacts/velopack-*/**/RELEASES
            artifacts/velopack-*/**/*.exe
            artifacts/velopack-*/**/*.zip
            artifacts/velopack-*/**/WingetGUIInstaller-${{ needs.prepare-version.outputs.vpk }}-win-*-full.nupkg
            artifacts/velopack-*/**/WingetGUIInstaller-${{ needs.prepare-version.outputs.vpk }}-win-*-delta.nupkg
